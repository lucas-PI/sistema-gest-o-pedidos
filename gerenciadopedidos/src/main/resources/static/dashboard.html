<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Pedidos</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/dashboard.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <div class="logo-icone" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart preview-icon"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg></div>
            <div>
                <h1>Painel de Pedidos</h1>
                <p>Gerencie e acompanhe seus pedidos</p>
            </div>
        </div>
        <div class="usuario">
            <div class="user-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round preview-icon"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
                <span id="nomeUsuario">Olá, usuário</span>
            </div>
            <div class="logout-icon">

                <button type="button" id="btnSair">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out preview-icon"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
                    Sair</button>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="resumo" aria-label="Resumo dos pedidos">
            <article class="card-resumo">
                <span class="resumo-icone-total"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package preview-icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg></span>
                <div>
                    <p>Total de pedidos</p>
                    <strong id="totalPedidos">-</strong>
                </div>
            </article>

            <article class="card-resumo">
                <span class="resumo-icone-progress"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-cw-fading-clock preview-icon"><path d="M12 3a9.75 9.75 0 0 1 6.74 2.74"/><path d="M18.74 5.74 21 8"/><path d="M21 8V3"/><path d="M7.5 19.794c-6-3.464-6-12.124 0-15.588"/><path d="M7.5 4.206A9 9 0 0 1 12 3"/><path d="M12 7v5l4 2"/><path d="M14 20.775A9 9 0 0 1 12 21"/><path d="M19 17.656a9 9 0 0 1-1.5 1.456"/><path d="M21 12a9 9 0 0 1-.228 2"/><path d="M21 8h-5"/></svg></span>

                <div>
                    <p>Em andamento</p>
                    <strong id="pedidosAndamento">-</strong>
                </div>
            </article>

            <article class="card-resumo">
                <span class="resumo-icone-delived"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package-check preview-icon"><path d="M12 22V12"/><path d="m16 17 2 2 4-4"/><path d="M21 11.127V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.32-.753"/><path d="M3.29 7 12 12l8.71-5"/><path d="m7.5 4.27 8.997 5.148"/></svg></span>

                <div>
                    <p>Concluídos</p>
                    <strong id="pedidosConcluidos">-</strong>
                </div>
            </article>

            <article class="card-resumo">
                <span class="resumo-icone-pending"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-exclamation-point preview-icon"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span>

                <div>
                    <p>Pedentes</p>
                    <strong id="pedidosPendentes">-</strong>
                </div>
            </article>

        </section>
        <section class="secao-pedidos">

            <div class="secao-cabecalho">

                <div class="secao-titulo">
                    <h2>Pedidos recentes</h2>
                    <p>Selecione um pedido para visualizar os detalhes.</p>
                </div>
                <div class="sub-secao-cabecalho">
                    <div class="filtros">
                        <input type="search"
                               id="buscarPedido"
                               placeholder="Buscar pedido por número ou cliente..."
                               aria-label="Buscar pedido por número ou cliente">
                    </div>


                    <select id="filtroStatus" aria-label="Filtrar pedidos por status">
                        <option value="">Todos os status</option>
                        <option value="PENDING">Pedente</option>
                        <option value="IN_PROGRESS">Em andamento</option>
                        <option value="DELIVERED">Entregue</option>
                    </select>
                </div>
            </div>

            <div class="lista-pedidos" id="listaPedidos">

            </div>


            <div>
                <button type="button" class="btn-down-page" aria-label="página anterior"> &lt </button>
                <button type="button" class="btn-up-page" aria-label="página superior"> &gt </button>
            </div>

        </section>
    </main>

</body>
</html>
