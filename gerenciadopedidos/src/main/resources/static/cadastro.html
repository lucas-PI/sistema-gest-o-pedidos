<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/cadastro.js" defer></script>
</head>
<body>
    <main class="pagina-cadastro">
        <aside class="pagina-lateral">
            <h1>Crie sua conta</h1>
            <p>Cadastre-se para ter acesso ao sistema.</p>
        </aside>
        <section class="area-formulario">
            <form id="form-cadastro">
                <header class="cabecalho-fomrulairo">
                    <h2>Cadastro de Usuário</h2>
                    <p>Preencha os campos abaixo para criar a sua conta.</p>
                </header>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text"
                           id="nome"
                           name="name"
                           placeholder="Digite seu nome completo"
                           autocomplete="name"
                           required
                    >
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Digite seu e-mail"
                           autocomplete="email">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password"
                           id="senha"
                           name="password"
                           placeholder="Digite sua senha"
                           autocomplete="new-password"
                           required>
                </div>
                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password"
                           id="confirmar-senha"
                           name="checkPassword"
                           placeholder="Confirme Sua senha"
                           autocomplete="new-passwrod"
                           required>
                </div>

                <button type="submit" class="botao-cadastrar">Cadastrar</button>
            </form>
        </section>
    </main>

</body>
</html>
